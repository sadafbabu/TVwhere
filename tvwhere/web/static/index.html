<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TVwhere</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/static/icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <h1 id="homeBtn" class="home-title">TVwhere</h1>
      <button id="addBtn" class="icon-btn" aria-label="Add playlist">+</button>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-section">
          <h2>Library</h2>
          <ul class="nav-list">
            <li><button data-view="favorites">★ Favorites</button></li>
            <li><button data-view="recent">⏱ Recent</button></li>
          </ul>
        </div>
        <div class="sidebar-section">
          <h2>My Playlists</h2>
          <ul id="playlistList"></ul>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar toolbar-top">
          <label class="toolbar-label">Country</label>
          <select id="countrySelect"></select>
        </div>
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Search channels..." autocomplete="off" />
          <select id="groupSelect"><option value="">All groups</option></select>
          <button id="refreshBtn" class="text-btn">Refresh</button>
        </div>

        <div id="playerPanel" class="player-panel hidden">
          <video id="video" controls playsinline></video>
          <div class="player-meta">
            <span id="nowPlaying"></span>
            <button id="extPlayBtn" class="text-btn">Open in player</button>
          </div>
        </div>

        <div id="channelList" class="channel-list"></div>
        <div id="emptyState" class="empty hidden">No channels</div>
        <div id="loading" class="loading hidden">Loading…</div>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2>Add playlist</h2>
      <div class="tabs">
        <button class="tab active" data-tab="m3u">M3U URL</button>
        <button class="tab" data-tab="xtream">Xtream</button>
      </div>
      <div id="tabM3u" class="tab-panel">
        <label>Name<input id="m3uName" placeholder="My playlist" /></label>
        <label>URL<input id="m3uUrl" placeholder="https://example.com/list.m3u" /></label>
        <label>EPG URL (optional)<input id="epgUrl" placeholder="https://example.com/epg.xml" /></label>
      </div>
      <div id="tabXtream" class="tab-panel hidden">
        <label>Name<input id="xcName" placeholder="Provider name" /></label>
        <label>Server<input id="xcServer" placeholder="http://server:port" /></label>
        <label>Username<input id="xcUser" /></label>
        <label>Password<input id="xcPass" type="password" /></label>
      </div>
      <p id="modalError" class="error"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn secondary">Cancel</button>
        <button id="modalSave" class="btn primary">Add</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
